{{- if eq .Values.global.userPlaneArchitecture "ulcl" }}
{{- with .Values.upfb }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "free5gc-upf.fullname" $ }}-{{ .name }}-configmap
  labels:
    app: {{ $.Values.global.projectName }}
data:
  upfcfg.yaml: |
    version: 1.0.3
    description: UPF initial local configuration

    # The listen IP and nodeID of the N4 interface on this UPF (Can't set to 0.0.0.0)
    pfcp:
      addr: {{ .n4if.ipAddress }}   # IP addr for listening
      nodeID: {{ .n4if.ipAddress }} # External IP or FQDN can be reached
      retransTimeout: 1s # retransmission timeout
      maxRetrans: 3 # the max number of retransmission

    gtpu:
      forwarder: gtp5g
      # The IP list of the N3/N9 interfaces on this UPF
      # If there are multiple connection, set addr to 0.0.0.0 or list all the addresses
      ifList:
        # gtp5g opens one socket; wildcard receives both N3 and N9 traffic.
        - addr: 0.0.0.0
          type: N3
          # name: upf.5gc.nctu.me
          # ifname: gtpif

    {{- toYaml .configuration | nindent 4 }}

  wrapper.sh: |
    #!/bin/sh

    iptables -C FORWARD -j ACCEPT 2>/dev/null || iptables -A FORWARD -j ACCEPT
    {{- range .configuration.dnnList }}
    iptables -t nat -C POSTROUTING -s {{ .cidr }} -o n6 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s {{ .cidr }} -o n6 -j MASQUERADE
    {{- end }}
    # Preserve GTP outer addresses; N3/N9 are transport interfaces, not Internet egress.
    ip route replace {{ $.Values.upf1.n9if.ipAddress }}/32 dev n9 src {{ .n9if.ipAddress }}
    ip route replace {{ $.Values.upf2.n9if.ipAddress }}/32 dev n9 src {{ .n9if.ipAddress }}

    {{- if $.Values.upfb.configmap.wrapperAdditionalCommands }}
    {{- $.Values.upfb.configmap.wrapperAdditionalCommands | toYaml | indent 2 }}
    {{- end }}

    /free5gc/upf/upf -c {{ .volume.mount }}/upfcfg.yaml

{{- end }}
{{- end }}
