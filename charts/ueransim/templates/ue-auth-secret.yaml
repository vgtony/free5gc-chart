{{- if .Values.ue.auth.create }}
{{- $name := required "ue.existingAuthSecret is required" .Values.ue.existingAuthSecret }}
{{- if not (regexMatch "^[0-9A-Fa-f]{32}$" .Values.ue.auth.key) }}
{{- fail "ue.auth.key must contain exactly 32 hexadecimal characters" }}
{{- end }}
{{- if not (regexMatch "^[0-9A-Fa-f]{32}$" .Values.ue.auth.op) }}
{{- fail "ue.auth.op must contain exactly 32 hexadecimal characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ueransim.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.ue.auth.key | quote }}
  op: {{ .Values.ue.auth.op | quote }}
{{- end }}
