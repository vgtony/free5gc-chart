{{- if and .Values.network.create (not .Values.network.existingNad) }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "ueransim.networkAttachmentName" . }}
  labels:
    {{- include "ueransim.labels" . | nindent 4 }}
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": {{ .Values.global.n2network.type | quote }},
          "capabilities": { "ips": true },
          "master": {{ .Values.global.n2network.masterIf | quote }},
          "mode": {{ ternary "l2" "bridge" (eq .Values.global.n2network.type "ipvlan") | quote }},
          "ipam": { "type": "static" }
        }
        {{- if eq .Values.global.n2network.type "macvlan" }},
        {
          "type": "tuning",
          "capabilities": { "mac": true }
        }
        {{- end }}
      ]
    }
{{- end }}
