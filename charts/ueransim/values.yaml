nameOverride: ""
fullnameOverride: ""

global:
  projectName: free5gc
  n2network:
    type: macvlan
    masterIf: eth0
    cidr: 24
  amf:
    n2if:
      ipAddress: 10.160.101.100
    service:
      ngap:
        port: 38412

image:
  # Build images/ueransim/Dockerfile and push it to a registry visible to every
  # eligible worker before deploying. The parent chart overrides this with the
  # registry used by the current lab.
  repository: ueransim
  tag: "3.3.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Map this abstract role to one or more real workers during cluster preparation.
# The chart never needs to know their hostnames.
nodeSelector:
  telecom.example/ran: "true"
tolerations: []
affinity: {}

network:
  # The gNB uses one Multus interface for both N2 (SCTP/NGAP) and N3 (GTP-U).
  # This matches this cluster, where both networks share the same L2 subnet.
  create: true
  existingNad: ""
  name: ran
  interfaceName: ran
  ipAddress: 10.160.101.231
  macAddress: ""

gnb:
  healthChecks:
    enabled: true
  replicaCount: 1
  service:
    port: 4997
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  config:
    mcc: "208"
    mnc: "93"
    nci: "0x000000010"
    idLength: 32
    tac: 1
    slices:
      - sst: 1
        sd: "010203"
    ignoreStreamIds: true
    cellAccessType: nr

ue:
  readinessProbe:
    exec:
      command: ["/bin/sh", "-ec", "ip -4 -o addr show | grep -Eq 'uesimtun[0-9]+.*inet '"]
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  replicaCount: 1
  # Helm creates a release-specific Secret by default. Supply the credentials
  # to use for this subscriber at installation time.
  # For an external Secret, set auth.create=false and existingAuthSecret.
  existingAuthSecret: ""
  auth:
    create: true
    key: ""
    op: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - NET_ADMIN
        - MKNOD
  config:
    supi: "imsi-208930000000003"
    mcc: "208"
    mnc: "93"
    protectionScheme: 0
    homeNetworkPublicKey: "5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650"
    homeNetworkPublicKeyId: 1
    routingIndicator: "0000"
    opType: OPC
    amf: "8000"
    imei: "356938035643803"
    imeiSv: "4370816125816151"
    tunNetmask: "255.255.255.0"
    sessions:
      - type: IPv4
        apn: internet
        slice:
          sst: 1
          sd: "010203"
    configuredNssai:
      - sst: 1
        sd: "010203"
    defaultNssai:
      - sst: 1
        sd: "010203"
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true

# Writes only the configured UE's free5GC v3.3.0 subscription records before nr-ue starts.
# Standalone installations opt in; the parent chart enables it by default.
provisioning:
  enabled: false
  image:
    repository: docker.io/library/mongo
    tag: "6.0.26"
    pullPolicy: IfNotPresent
  mongoUri: "mongodb://mongodb:27017/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000"
  # For an authenticated database, use a Secret containing the full connection URI.
  existingMongoSecret: ""
  mongoSecretKey: uri
  database: free5gc
  waitSeconds: 300
  initialSqn: "000000000000"
  # v3.3.0 uses a string. Select object only for cores using the newer schema.
  sequenceNumberFormat: string
  # modern uses encPermanentKey/encOpcKey and requires object SQN.
  authenticationSchema: legacy
  # Convert matching records while retaining their current SQN; never rotate credentials.
  migrateAuthentication: false
  ueAmbr:
    uplink: "1 Gbps"
    downlink: "2 Gbps"
  sessionAmbr:
    uplink: "1 Gbps"
    downlink: "2 Gbps"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
